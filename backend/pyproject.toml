[project]
name = "joinly-backend"
version = "0.1.0"
description = "Tool server for joinly GPT-Live mode (Responses delegation function tools)"
readme = "README.md"
authors = [
    { name = "Vijay Selvaraj" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.11.7",
    "uvicorn>=0.35.0",
]

[project.scripts]
joinly-backend = "joinly_backend.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["joinly_backend"]
